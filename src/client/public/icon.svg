<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanLoom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Loom Grid Threads (Network Geometry) -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6">
    <line x1="128" y1="96" x2="128" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="384" y1="96" x2="384" y2="416" />
    <line x1="96" y1="170" x2="416" y2="170" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="342" x2="416" y2="342" />
  </g>

  <!-- Gateway & Loom Core Glyph: Stylized 'P' woven through port nodes -->
  <g filter="url(#glow)">
    <!-- Vertical Backbone Spine -->
    <rect x="144" y="116" width="36" height="280" rx="18" fill="url(#cyanLoom)" />

    <!-- Top Loop Bridge (weaving right and down) -->
    <path d="M 162 134 H 304 C 362 134 396 172 396 230 C 396 288 362 326 304 326 H 162" 
          fill="none" stroke="url(#cyanLoom)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Intersecting Security & Proxy Warp Thread (Emerald SSL Shield Strand) -->
    <path d="M 238 210 L 320 292 C 344 316 344 354 320 378 C 296 402 258 402 234 378 L 196 340"
          fill="none" stroke="url(#emeraldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <!-- Network Port Nodes -->
    <circle cx="162" cy="134" r="14" fill="#FFFFFF" />
    <circle cx="396" cy="230" r="14" fill="#00F0FF" />
    <circle cx="280" cy="378" r="12" fill="#34D399" />
    <circle cx="162" cy="396" r="14" fill="#FFFFFF" />
  </g>
</svg>
