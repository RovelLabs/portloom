name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build distribution
        run: npm run build

      - name: Create Release Archive
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Compress-Archive -Path dist, bin, assets, portloom.cmd, Portloom.vbs, package.json, package-lock.json, README.md, LICENSE -DestinationPath "portloom-$tag-win-x64.zip" -Force
          Get-FileHash -Algorithm SHA256 "portloom-$tag-win-x64.zip" | Out-File "SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            portloom-*-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
